# Cloudflare Pages configuration.
# Deploy:  npx wrangler pages deploy dist --project-name churchbased-bible
# (or connect the git repo in the Cloudflare dashboard: build command
#  "npm run build", output directory "dist")
name = "churchbased-bible"
compatibility_date = "2026-07-01"
pages_build_output_dir = "dist"

# Non-secret contact-form config (RESEND_API_KEY is set as an encrypted
# variable in the Pages dashboard, never here).
[vars]
CONTACT_TO = "churchbased.bible@unfoldingword.org"
CONTACT_FROM = "CBBT Website <noreply@churchbased.bible>"
