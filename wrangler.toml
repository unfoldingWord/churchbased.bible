# Cloudflare Workers + Static Assets configuration.
# Deploy:  npx wrangler deploy   (the dashboard build runs this automatically)
# `npm run build` produces dist/; the Worker in worker/index.ts serves the
# legacy redirects, falling through to the static assets.
name = "churchbased-bible"
main = "worker/index.ts"
compatibility_date = "2026-07-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# Serve /404.html (with a 404 status) for any unmatched path.
not_found_handling = "404-page"
